name: Release Cross-Platforms

# Push a tag like "v2.6.2" to build the installer and publish a GitHub Release
# with it attached, with release notes generated from the commits since the
# previous tag. `workflow_dispatch` lets you run the same pipeline manually
# (e.g. to test it) without needing a real tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 2.6.2) - only used for manual runs"
        required: true

permissions:
  contents: write

jobs:
  detect-runners:
    # Any online self-hosted runner is preferred over GitHub-hosted ones,
    # matched generically by OS (and, for the Linux matrix, by X64/ARM64
    # arch labels) rather than by name - currently nekorpi1 (Linux ARM64) and
    # vmi555990 (Linux X64), but adding/renaming/replacing runners later, or
    # adding a self-hosted Windows/macOS box, needs no workflow edit. GitHub
    # Actions has no native "try self-hosted, else hosted": a job queued for
    # an offline self-hosted runner just waits forever (timeout-minutes only
    # starts counting once a runner picks the job up, not while it's
    # queued), so this job checks runner status via the API first and hands
    # the actual runs-on labels down to every other job through its outputs.
    # Every other job now depends on this one (previously build-and-release
    # ran in parallel with it) so its own runs-on can be resolved first - the
    # cost is a small serial delay (this is just an API call, seconds) in
    # exchange for the Windows/macOS jobs also getting self-hosted routing.
    #
    # Requires a repo secret RUNNER_STATUS_PAT: a PAT (classic with the "repo"
    # scope covering org runner read access, or fine-grained with the org's
    # "Self-hosted runners: Read" permission) - the default GITHUB_TOKEN can't
    # call the org runners API. If the secret is missing or the call fails,
    # this falls back to GitHub-hosted runners across the board rather than
    # failing the whole release.
    runs-on: ubuntu-latest
    outputs:
      x64_runner: ${{ steps.pick.outputs.x64_runner }}
      arm64_runner: ${{ steps.pick.outputs.arm64_runner }}
      windows_runner: ${{ steps.pick.outputs.windows_runner }}
      macos_runner: ${{ steps.pick.outputs.macos_runner }}
    steps:
      - name: Check self-hosted runner status
        id: pick
        shell: pwsh
        run: |
          $x64Runner = '["ubuntu-latest"]'
          $arm64Runner = '["ubuntu-latest"]'
          $windowsRunner = '["windows-latest"]'
          $macosRunner = '["macos-latest"]'
          if ($env:RUNNER_STATUS_PAT) {
            try {
              $headers = @{
                "Authorization" = "Bearer $env:RUNNER_STATUS_PAT"
                "Accept"        = "application/vnd.github+json"
                "User-Agent"    = "ZFTP-CI"
              }
              $resp = Invoke-RestMethod -Uri "https://api.github.com/orgs/${{ github.repository_owner }}/actions/runners?per_page=100" -Headers $headers
              # "busy" (mid-job) is still fine to target - it'll just run next.
              # Only "offline" means the job would queue forever - fall back then.
              $online = $resp.runners | Where-Object { $_.status -eq "online" }
              $onlineLinux = $online | Where-Object { $_.os -eq "linux" }
              $x64   = $onlineLinux | Where-Object { $_.labels.name -contains "X64" }   | Select-Object -First 1
              $arm64 = $onlineLinux | Where-Object { $_.labels.name -contains "ARM64" } | Select-Object -First 1
              $win   = $online | Where-Object { $_.os -eq "windows" } | Select-Object -First 1
              $mac   = $online | Where-Object { $_.os -eq "macos" }   | Select-Object -First 1
              if ($x64)   { $x64Runner     = '["self-hosted","Linux","X64"]' }
              if ($arm64) { $arm64Runner   = '["self-hosted","Linux","ARM64"]' }
              if ($win)   { $windowsRunner = '["self-hosted","Windows"]' }
              if ($mac)   { $macosRunner   = '["self-hosted","macOS"]' }
              Write-Output "Online self-hosted runners: $($online.name -join ', ')"
            } catch {
              Write-Warning "Couldn't query self-hosted runner status ($_) - falling back to GitHub-hosted runners."
            }
          } else {
            Write-Warning "RUNNER_STATUS_PAT secret not set - falling back to GitHub-hosted runners."
          }
          Write-Output "x64 runner: $x64Runner"
          Write-Output "arm64 runner: $arm64Runner"
          Write-Output "windows runner: $windowsRunner"
          Write-Output "macos runner: $macosRunner"
          "x64_runner=$x64Runner" >> $env:GITHUB_OUTPUT
          "arm64_runner=$arm64Runner" >> $env:GITHUB_OUTPUT
          "windows_runner=$windowsRunner" >> $env:GITHUB_OUTPUT
          "macos_runner=$macosRunner" >> $env:GITHUB_OUTPUT
        env:
          RUNNER_STATUS_PAT: ${{ secrets.RUNNER_STATUS_PAT }}

  build-and-release:
    needs: detect-runners
    runs-on: ${{ fromJson(needs.detect-runners.outputs.windows_runner) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed to diff against the previous tag
          fetch-tags: true

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
            $tagName = "v$version"
          } else {
            $tagName = "${{ github.ref_name }}"
            $version = $tagName.TrimStart("v")
          }
          # Inno Setup's AppVersion / .NET's AssemblyVersion both want a plain
          # dotted-numeric string - pad a short tag like "2.6" out to 4 parts.
          $parts = @($version -split "\." | Where-Object { $_ -match "^\d+$" })
          while ($parts.Count -lt 4) { $parts += "0" }
          $assemblyVersion = ($parts[0..3] -join ".")

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download WinFsp installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path prereqs | Out-Null
          $headers = @{ "User-Agent" = "ZFTP-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/winfsp/winfsp/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^winfsp-.*\.msi$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a WinFsp .msi asset in the latest release." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "prereqs\winfsp.msi"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ZFTP.Core's net8.0-windows build references winfsp-msil.dll from the
      # real WinFsp install location - it must actually be installed on the
      # runner (not just downloaded) before anything gets built/published.
      - name: Install WinFsp
        shell: pwsh
        run: |
          # A single quoted argument string (not a comma-separated -ArgumentList
          # array) is the reliable form for Start-Process+msiexec. Verbose
          # logging so a failure here is diagnosable instead of a bare exit code.
          $msiLog = "prereqs\winfsp-install.log"
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"prereqs\winfsp.msi`" /quiet /qn /norestart /l*v `"$msiLog`"" -Wait -PassThru
          Write-Output "msiexec exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $msiLog) { Get-Content $msiLog -Tail 40 }
            throw "WinFsp install failed with exit code $($proc.ExitCode)"
          }

      # tools\rclone.exe is a committed binary (see ZFTP.App.csproj) so local dev
      # builds always have something to publish - this overwrites it with
      # whatever rclone has released most recently right before we build, so
      # every shipped installer bundles the latest rclone without anyone having
      # to remember to manually re-download and commit a new copy.
      - name: Update bundled rclone
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "ZFTP-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/rclone/rclone/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match '^rclone-v.*-windows-amd64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find a rclone windows-amd64 .zip asset in the latest release." }
          $zip = "$env:RUNNER_TEMP\rclone.zip"
          $extractDir = "$env:RUNNER_TEMP\rclone-extract"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extractDir -Force
          $exe = Get-ChildItem -Path $extractDir -Filter rclone.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "rclone.exe not found inside the downloaded rclone archive." }
          Copy-Item $exe.FullName "src\ZFTP.App\tools\rclone.exe" -Force
          Write-Output "Bundled rclone updated to $($rel.tag_name)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore ZFTP.sln

      - name: Publish ZFTP.App
        # ZFTP.App now multi-targets net8.0-windows;net8.0 (Linux/macOS via
        # Avalonia) - -f picks the Windows build for this installer.
        run: >
          dotnet publish src/ZFTP.App/ZFTP.App.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false
          -o publish
          -p:Version=${{ steps.version.outputs.assembly_version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}

      - name: Publish ZFTP.Updater
        run: >
          dotnet publish src/ZFTP.Updater/ZFTP.Updater.csproj -c Release -r win-x64 --self-contained false
          -o publish
          -p:Version=${{ steps.version.outputs.assembly_version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}

      - name: Download .NET 8 Desktop Runtime installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe" -OutFile "prereqs\windowsdesktop-runtime.exe"

      - name: Compile installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/ZFTP.iss
          options: >-
            /DMyAppVersion=${{ steps.version.outputs.version }}
            /DPublishDir="${{ github.workspace }}\publish"
            /DIconFile="${{ github.workspace }}\src\ZFTP.App\zftp.ico"
            /DWinFspMsi="${{ github.workspace }}\prereqs\winfsp.msi"
            /DDotNetExe="${{ github.workspace }}\prereqs\windowsdesktop-runtime.exe"
            /DMyOutputDir="${{ github.workspace }}\dist"

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag_name }}"
          $prevTag = $null
          if ("${{ github.event_name }}" -eq "push") {
            $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null
            if ($LASTEXITCODE -ne 0) { $prevTag = $null }
          } else {
            $prevTag = git describe --tags --abbrev=0 2>$null
            if ($LASTEXITCODE -ne 0) { $prevTag = $null }
          }

          if ($prevTag) {
            $range = "$prevTag..HEAD"
          } else {
            $range = "-30" # first-ever release: just the most recent commits
          }
          $log = if ($range -eq "-30") { git log -30 --pretty=format:"%s|||%h" } else { git log $range --pretty=format:"%s|||%h" }

          $added = @(); $fixed = @(); $changed = @(); $other = @()
          foreach ($line in $log) {
            if (-not $line) { continue }
            $bits = $line -split '\|\|\|', 2
            $msg = $bits[0]; $hash = $bits[1]
            if ($msg -match '^\s*(feat|feature|add)(\(|:)') { $added += "- $msg ($hash)" }
            elseif ($msg -match '^\s*fix(\(|:)') { $fixed += "- $msg ($hash)" }
            elseif ($msg -match '^\s*(refactor|perf|chore|style|docs|build|ci)(\(|:)') { $changed += "- $msg ($hash)" }
            else { $other += "- $msg ($hash)" }
          }

          $body = "## ZFTP $tag`n`n"
          if ($added.Count)   { $body += "### Added`n" + ($added -join "`n") + "`n`n" }
          if ($fixed.Count)   { $body += "### Fixed`n" + ($fixed -join "`n") + "`n`n" }
          if ($changed.Count) { $body += "### Changed`n" + ($changed -join "`n") + "`n`n" }
          if ($other.Count)   { $body += "### Other`n" + ($other -join "`n") + "`n`n" }
          if (-not $prevTag)  { $body += "_Initial release._`n" }

          $body | Out-File -FilePath changelog.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ZFTP ${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: dist/ZFTP-Setup-*.exe

  build-linux:
    # Runs after the Windows job so the GitHub Release already exists - this
    # job just adds Linux assets to it. A tarball (always works) plus an
    # AppImage (needs an actual Linux host to run appimagetool - not possible
    # from a Windows machine, which is exactly why this lives in CI). arm64 is
    # cross-compiled when running on a hosted x64 runner (framework-dependent
    # publish needs no arm64 hardware to build, only to run) - not needed when
    # nekorpi1, an actual ARM64 box, picks up that leg instead.
    needs: [build-and-release, detect-runners]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runner: ${{ needs.detect-runners.outputs.x64_runner }}
          - rid: linux-arm64
            runner: ${{ needs.detect-runners.outputs.arm64_runner }}
    runs-on: ${{ fromJson(matrix.runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build tarball
        run: installer/linux/build-tarball.sh "${{ needs.build-and-release.outputs.version }}" "${{ matrix.rid }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # download-rclone.sh: raises the GitHub API rate limit

      - name: Build AppImage
        run: installer/linux/build-appimage.sh "${{ needs.build-and-release.outputs.version }}" "${{ matrix.rid }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux assets to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build-and-release.outputs.tag_name }}
          files: |
            dist/ZFTP-*-linux-*.tar.gz
            dist/ZFTP-*-x86_64.AppImage
            dist/ZFTP-*-aarch64.AppImage

  build-macos:
    # Runs after the Windows job so the GitHub Release already exists - this
    # job just adds the macOS asset to it. Needs an actual macOS host to
    # publish/archive for osx-arm64 (Apple Silicon - the only Mac target
    # ci.yml currently builds/tests). Unsigned/unnotarized for now - see the
    # note in installer/mac/build-tarball.sh.
    needs: [build-and-release, detect-runners]
    runs-on: ${{ fromJson(needs.detect-runners.outputs.macos_runner) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build tarball
        run: installer/mac/build-tarball.sh "${{ needs.build-and-release.outputs.version }}" osx-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # download-rclone.sh: raises the GitHub API rate limit

      - name: Upload macOS asset to the release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build-and-release.outputs.tag_name }}
          files: dist/ZFTP-*-osx-arm64.tar.gz
